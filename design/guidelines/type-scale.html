<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:var(--surface);color:var(--text)}.nm{font:500 13px/18px var(--font-body);margin-top:10px}.hx{font:400 12px/16px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:16px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--font-body)}.r{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:baseline;padding:9px 0}.k{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="r"><span class="k">display-number 48/56 300</span><span class="kc-display-number">$18,240</span></div><div class="r"><span class="k">page-title 26/34 400</span><span class="kc-page-title">Good morning, Maria</span></div><div class="r"><span class="k">section-title 17/24 500</span><span class="kc-section-title">Waiting for you</span></div><div class="r"><span class="k">advisor 19/30 serif</span><span class="kc-advisor">I paused this payment. The bank details changed.</span></div><div class="r"><span class="k">body 15/22 400</span><span class="kc-body">Matches the delivery on Oct 14.</span></div><div class="r"><span class="k">label 13/18 500</span><span class="kc-label">Cash on hand</span></div><div class="r"><span class="k">caption 12/16 muted</span><span class="kc-caption">Prepared 9:14 am</span></div></body></html>
