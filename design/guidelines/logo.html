<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:var(--surface);color:var(--text)}.nm{font:500 13px/18px var(--font-body);margin-top:10px}.hx{font:400 12px/16px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:16px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--font-body)}body{display:grid;grid-template-columns:1fr 1fr;gap:16px}.t{border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;height:244px}img{max-width:70%;max-height:196px}</style></head><body><div class="t" style="background:var(--surface-muted)"><img src="../assets/logo-full-dark.png" alt="KaChing"></div><div class="t" style="background:var(--surface)"><img src="../assets/logo-wordmark-dark.png" alt="KaChing" style="max-width:80%"></div></body></html>
