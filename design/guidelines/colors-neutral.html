<!-- @dsCard group="Colors" viewport="700x200" name="Surfaces & text" subtitle="Navy-tinted charcoal in three quiet steps. Separation by surface, not boxes." -->
<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:var(--surface);color:var(--text)}.nm{font:500 13px/18px var(--font-body);margin-top:10px}.hx{font:400 12px/16px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:16px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--font-body)}.st{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-radius:var(--radius-lg);overflow:hidden}.st div{height:96px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font:500 12px var(--font-body)}.st span{font:400 11px var(--font-mono);color:var(--text-muted)}.tx{display:flex;gap:32px;margin-top:20px;font:400 15px var(--font-body)}</style></head><body><div class="st"><div style="background:var(--surface)">surface<span>#0F141A</span></div><div style="background:var(--surface-muted)">surface-muted<span>#151C24</span></div><div style="background:var(--surface-raised)">surface-raised<span>#1B2430</span></div><div style="background:var(--surface-raised);box-shadow:inset 0 -2px 0 var(--border)">border · lines only<span>#283340</span></div></div><div class="tx"><span>text <span class="hx">#E6ECF1 · 13.1–15.5:1</span></span><span style="color:var(--text-muted)">text-muted <span class="hx">#93A1AE · 5.9–7.0:1</span></span></div></body></html>
