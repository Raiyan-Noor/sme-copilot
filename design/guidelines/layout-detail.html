<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><title>Layout — detail panel</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:28px;background:var(--surface);color:var(--text)}.fr{position:relative;width:644px;height:403px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--border);overflow:hidden;background:var(--surface)}.a{position:absolute}.bar{position:absolute;height:6px;border-radius:3px;background:var(--surface-raised)}.col{position:absolute;top:0;bottom:0;width:322px;box-shadow:inset 1px 0 0 0 transparent;border-left:1px dashed var(--border-strong);border-right:1px dashed var(--border-strong);box-sizing:border-box}.av{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--brand-primary)}.appr{position:absolute;height:52px;border-radius:9px;background:var(--surface-muted);box-shadow:inset 0 0 0 1px var(--kc-gold-line)}.own{position:absolute;height:20px;border-radius:10px;background:var(--surface-raised)}.cmp{position:absolute;height:22px;border-radius:11px;background:var(--surface-raised)}.lbl{position:absolute;height:4px;width:48px;border-radius:2px;background:var(--surface-raised)}.num{position:absolute;height:12px;border-radius:3px;background:var(--kc-mist-muted);opacity:.45}.nav{position:absolute;height:12px;border-radius:6px;background:var(--surface-muted)}.ann{position:relative;width:644px;height:44px;margin-top:10px}.br{position:absolute;top:0;height:7px;border:1px solid var(--border-strong);border-bottom:0;box-sizing:border-box}.br span{position:absolute;top:13px;left:0;right:0;text-align:center;font:400 11px/14px var(--font-mono);color:var(--text-muted);white-space:nowrap}.br b{font-weight:500;color:var(--text)}.ctr{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--brand-primary);opacity:.7}.tag{position:absolute;font:500 10px/14px var(--font-mono);color:var(--brand-primary)}.cap{font:400 13px/18px var(--font-body);color:var(--text-muted);margin-top:4px;max-width:644px}</style></head><body><div class="fr"><div class="a" style="left:14px;top:14px;width:46px;height:8px;border-radius:4px;background:var(--surface-raised)"></div><div class="col" style="left:36px"></div>
