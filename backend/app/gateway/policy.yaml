# Gateway policy: the canonical tier assignment for every action. Must match the Tiers table in CLAUDE.md.
#
# The LLM proposes; this file and the gateway decide (invariant 1). Rules applied by the gateway:
#   - Unknown tools are denied.
#   - Any argument with provenance "untrusted" escalates the action to T3, whatever its normal tier (invariant 3).
#   - T2 runs only under a valid, unexpired, Ed25519-signed standing mandate; caps below are hard ceilings the
#     mandate may lower but never raise (invariant 6).
#   - T3 runs only after the owner signs the exact payload {action, args_hash, nonce, expiry}.
#   - T4 has no tools, by design (invariant 5). Matching requests get analysis only and are logged as violations.
#   - T2 rules name which argument carries the amount (amount_arg) and which is checked against the mandate's
#     signed allow-list (allowlist_arg). Breaking a T2 cap, allow-list or frequency rule is denied, not escalated.
# Money is integer minor units. Expiry is a simulated-clock date, inclusive.

version: 1
default_decision: deny

untrusted_provenance:
  escalate_to: T3

approvals:
  ttl_days: 2                     # a T3 approval request expires this many days after it is proposed
  standing_mandate_max_days: 90   # a T2 standing mandate may not be signed for longer than this

tiers:
  T1:
    description: Autonomous, read/compute only
    execution: autonomous
    tools:
      - "get_*"
      - "list_*"
      - explain_fact
      - match_financing
      - get_passport

  T2:
    description: Autonomous under a signed standing mandate with hard caps
    execution: standing_mandate
    tools:
      send_invoice_reminder:
        amount_arg: invoice_amount_minor
        max_amount_minor: 50000
        allowlist_arg: customer_id      # owner-signed allow-list of customers
        frequency:
          max: 1
          per: customer_id
          window_days: 3
      pay_recurring_bill:
        amount_arg: amount_minor
        max_amount_minor: 50000
        allowlist_arg: payee_id         # owner-signed list of known payees

  T3:
    description: Agent prepares, owner signs the exact payload
    execution: owner_signature
    tools:
      submit_loan_application: {}
      change_payee_details:
        requires_out_of_band_call_script: true
      delay_supplier_payment: {}
      send_supplier_message: {}
      cancel_subscription: {}

  T4:
    description: Not implemented, by design. Analysis only; attempts are logged as violations.
    execution: never
    tools: []
    refused_request_categories:
      - large_debt
      - hiring_or_firing
      - pricing_change
      - deal_commitment

# System tools: never in the planner's registry; callable only by the system.
system_tools:
  anchor:
    tier: T1
    caller: system
    testnet_only: true
    allowed_chain_ids: [11155111, 84532]
    moves_value: false
    rate_cap:
      max: 12
      window_minutes: 60
