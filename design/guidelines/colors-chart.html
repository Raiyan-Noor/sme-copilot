<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:var(--surface);color:var(--text)}.nm{font:500 13px/18px var(--font-body);margin-top:10px}.hx{font:400 12px/16px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:16px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--font-body)}.leg{display:flex;gap:24px;margin-top:12px;font:400 12px var(--font-body);color:var(--text-muted)}.leg span{display:inline-flex;align-items:center;gap:8px}.leg i{display:inline-block;width:20px;height:0;border-top:2px solid}</style></head><body><svg viewBox="0 0 640 130" width="100%" style="display:block"><line x1="0" x2="640" y1="30" y2="30" stroke="var(--border)" opacity=".6"/><line x1="0" x2="640" y1="70" y2="70" stroke="var(--border)" opacity=".6"/><line x1="0" x2="640" y1="110" y2="110" stroke="var(--chart-3)" stroke-dasharray="4 5" stroke-width="1.25"/><path d="M0,60 L80,52 L160,64 L240,48 L320,72 L400,90 L480,66 L560,44 L640,38" fill="none" stroke="var(--chart-2)" stroke-width="1.5"/><path d="M0,40 L80,34 L160,46 L240,30 L320,58 L400,84 L480,52 L560,28 L640,20" fill="none" stroke="var(--chart-1)" stroke-width="2"/></svg><div class="leg"><span><i style="border-color:var(--chart-1)"></i>chart-1 · main · #02A27D</span><span><i style="border-color:var(--chart-2)"></i>chart-2 · secondary · #5E9C98</span><span><i style="border-top-style:dashed;border-color:var(--chart-3)"></i>chart-3 · safety buffer · #6B7A89</span><span><i style="border-color:var(--chart-4)"></i>chart-4 · #3E5A6E</span><span><i style="border-color:var(--chart-5)"></i>chart-5 · #2E3A48</span></div></body></html>
