<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:var(--surface);color:var(--text)}.nm{font:500 13px/18px var(--font-body);margin-top:10px}.hx{font:400 12px/16px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:16px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--font-body)}.ex{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.p{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;color:var(--brand-accent);box-shadow:inset 0 0 0 1px var(--kc-gold-line);font:500 12px var(--font-body)}.o{padding:16px 18px;border-radius:var(--radius-lg);background:var(--surface-muted);box-shadow:inset 0 0 0 1px var(--kc-gold-line);font:400 14px var(--font-body);flex:1}.n{display:flex;gap:16px;margin-top:20px;font:400 12px var(--font-body);color:var(--text-muted)}.n b{color:var(--danger);font-weight:500}</style></head><body><div class="ex"><span class="p">● Waiting for approval</span><span style="color:var(--brand-accent);font:500 14px var(--font-body)">2 decisions need you</span><div class="o"><span style="color:var(--brand-accent);font-size:13px">One thing to improve</span><br>Cancel two unused tools</div></div><div class="n"><span>#F9A415 · 7.7–9.1:1 as text on all surfaces · outline at 45% alpha</span><b>Never a card, button or banner fill</b></div></body></html>
