<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:var(--surface);color:var(--text)}.nm{font:500 13px/18px var(--font-body);margin-top:10px}.hx{font:400 12px/16px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:16px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--font-body)}.row{display:flex;gap:20px}.b{flex:1;height:96px;border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:12px 14px;font:400 12px/16px var(--font-body);color:var(--text-muted)}.b b{display:block;color:var(--text);font-weight:500}</style></head><body><div class="row"><div class="b" style="background:var(--surface-muted)"><span><b>Group</b>surface-muted, no border</span></div><div class="b" style="background:var(--surface-raised)"><span><b>Inset / control</b>surface-raised</span></div><div class="b" style="background:var(--surface-raised);box-shadow:var(--shadow-2)"><span><b>Floating</b>shadow-2 · sheet, toast</span></div><div class="b" style="background:var(--surface-muted);outline:2px solid var(--focus-ring);outline-offset:2px"><span><b>Focus</b>2px brand-primary, 2px offset</span></div></div></body></html>
