# Skill Pack: general shop. The fallback when onboarding cannot match the owner's business to a specialist pack.
# Format: app/packs/schema.py. Derived from the grocery pack with generic stock categories and questions.
# All benchmarks below are synthetic, chosen for the demo, and labelled as such in the UI.
# No money amounts here: thresholds are ratios, counts and day windows (currency- and region-neutral).
id: general_retail
version: 1
display_name: General shop
benchmarks_synthetic: true
kpi_lookback_days: 90

# Ordered: the first matching rule wins. Moves between the business's own accounts come first so they never count
# as revenue. Revenue rules match inflows, transfers both directions, the rest outflows unless `direction` says
# otherwise. Keep keywords specific: "emi" would also match "premium".
categories:
  internal_transfer:
    label: Moves between own accounts
    kind: transfer
    match:
      channel: [internal_transfer]
      description: [paynest settlement, settlement to bank, cash deposit branch, deposit to bank, transfer between own accounts]
  sales_wallet:
    label: Mobile wallet sales
    kind: revenue
    digital: true
    match: {counterparty: [wallet customer], description: [payment received, qr payment]}
  sales_card:
    label: Card sales
    kind: revenue
    digital: true
    match: {description: [card settlement, card sales, acquirer]}
  sales_cash:
    label: Cash sales
    kind: revenue
    match: {description: [cash sales, z-report, till takings]}
  # Credit customers paying invoices. Scheduled: open receivables reach the forecast from scheduled items, so
  # their history stays out of the weekday baseline. Not `digital`: bank transfers carry no payment fees.
  customer_invoice:
    label: Customer invoice payments
    kind: revenue
    scheduled: true
    match: {description: [transfer from, invoice payment]}
  stock_purchases:
    label: Stock purchases
    kind: cogs
    match: {counterparty: [wholesale, distributor, trading, supplier, traders, imports], description: [stock purchase, wholesale, restock, goods purchase]}
  rent:
    label: Rent
    kind: operating
    scheduled: true
    match: {counterparty: [landlord, property, properties, realty], description: [rent]}
  payroll:
    label: Staff wages
    kind: operating
    scheduled: true
    match: {description: [payroll, salary, wages]}
  late_fees_penalties:
    label: Late fees and penalties
    kind: operating
    match: {description: [late fee, late payment, penalty]}
  insurance:
    label: Insurance
    kind: operating
    scheduled: true
    match: {counterparty: [insurance], description: [insurance]}
  utilities:
    label: Power, water and internet
    kind: operating
    scheduled: true
    match:
      counterparty: [electric, power, water, utility, broadband, internet, telecom]
      description: [electricity, water bill, utility, broadband, internet]
  payment_fees:
    label: Payment fees
    kind: operating
    match: {description: [merchant fee, merchant service fee, platform fee, transaction fee, processing fee, settlement fee, wallet fee, mdr]}
  software_subscriptions:
    label: Software subscriptions
    kind: operating
    scheduled: true
    match: {counterparty: [pos system, point of sale, software, cloud], description: [subscription, scheduler, pos plan, monthly plan]}
  repairs_maintenance:
    label: Repairs and refrigeration
    kind: operating
    match: {description: [repair, refrigerat, freezer, cold room, chiller]}
  spoilage_disposal:
    label: Waste and spoilage disposal
    kind: operating
    match: {description: [waste collection, disposal, spoilage]}
  packaging:
    label: Bags and packaging
    kind: operating
    match: {description: [packaging, carrier bags, paper bags]}
  shop_running:
    label: Cleaning, deliveries and petty cash
    kind: operating
    match: {description: [cleaning, delivery tip, supplies, petty cash]}
  owner_drawings:
    label: Owner drawings
    kind: owner
    match: {description: [owner drawings, owner draw, owner savings, personal withdrawal]}
  loan_repayment:
    label: Loan repayments
    kind: transfer
    scheduled: true
    match: {direction: out, description: [loan repayment, loan installment]}

# The forecast multiplies its weekday baseline by the month multiplier and the strongest holiday window that
# covers the day. Holiday IDs are generic types; the business's holiday calendar maps them to dates.
seasonality:
  months: {1: 1.00, 2: 0.97, 3: 1.00, 4: 1.02, 5: 1.00, 6: 0.98, 7: 0.97, 8: 0.98, 9: 1.00, 10: 1.02, 11: 1.03, 12: 1.08}
  holidays:
    major_festival: 1.90
    minor_holiday: 1.30
    year_end: 1.10

kpis:
  - {id: gross_margin, label: Gross margin, unit: ratio, source: ratio, numerator: [cogs], denominator: [revenue], complement: true, healthy: {min: 0.18, max: 0.32}}
  - {id: rent_share, label: Rent as share of sales, unit: ratio, source: ratio, numerator: [rent], denominator: [revenue], healthy: {max: 0.08}}
  - {id: payroll_share, label: Wages as share of sales, unit: ratio, source: ratio, numerator: [payroll], denominator: [revenue], healthy: {max: 0.12}}
  - {id: payment_fee_share, label: Payment fees as share of digital sales, unit: ratio, source: ratio, numerator: [payment_fees], denominator: [sales_wallet, sales_card], healthy: {max: 0.015}}
  - {id: spoilage_share, label: Spoilage disposal as share of stock bought, unit: ratio, source: ratio, numerator: [spoilage_disposal], denominator: [cogs], healthy: {max: 0.03}}
  - {id: digital_share, label: Digital share of sales, unit: ratio, source: ratio, numerator: [sales_wallet, sales_card], denominator: [revenue], healthy: {min: 0.40}}
  - {id: buffer_days, label: Cash buffer, unit: days, source: engine, metric: buffer_days, healthy: {min: 14, max: 60}}

# Ledger detectors read categorized statement rows; supplier_price_creep, missed_early_pay_discounts and
# slow_moving_stock read the business's purchase lines, unprofitable_products its point-of-sale lines.
leak_detectors:
  - detector: duplicate_subscription
    label: Paying twice for the same software
    params:
      categories: [software_subscriptions]
      groups: {pos: [pos, point of sale], bookkeeping: [bookkeeping, accounting]}
      lookback_days: 120
      min_months: 2
  - detector: payment_fees
    label: Payment fees above the usual rate
    params: {fee_categories: [payment_fees], lookback_days: 90, max_share_of_digital: 0.015}
  - detector: late_fees
    label: Late fees and penalties paid
    params: {keywords: [late fee, late payment, penalty], lookback_days: 180}
  - detector: supplier_price_creep
    label: Supplier raising unit prices
    params: {lookback_days: 365, min_purchases: 6, min_increase: 0.05}
  - detector: unprofitable_products
    label: Product sold below cost
    params: {lookback_days: 180, min_sale_days: 14}
  - detector: missed_early_pay_discounts
    label: Early-payment discounts missed
    params: {lookback_days: 365, min_invoices: 2}
  - detector: slow_moving_stock
    label: Stock that is not selling
    params: {min_days_held: 30, max_sell_through: 0.5, carrying_cost_rate: 0.30}
  - detector: losing_ad_campaigns
    label: Ad campaign costing more than it earns
    params: {lookback_days: 90, min_roas: 1.0}

# Ranking input for the financing matcher; eligibility stays with each product's own rules.
financing_fit:
  inventory_financing: {fit: 0.90, reason: Fast-turning stock suits short stock-backed financing}
  working_capital_loan: {fit: 0.80, reason: Steady daily sales support regular installments}
  nano_loan: {fit: 0.75, reason: Small amounts match short restocking gaps}
  overdraft: {fit: 0.70, reason: Covers short gaps between supplier payments and sales}
  equipment_lease: {fit: 0.60, reason: Useful for fridges and freezers}
  merchant_cash_advance: {fit: 0.35, reason: Daily sweeps are costly on thin margins}
  invoice_financing: {fit: 0.10, reason: Few invoices; most customers pay at the till}

readiness:
  factors:
    inflow_regularity: {weight: 0.25, worst: 0.30, best: 0.90}
    revenue_stability: {weight: 0.20, worst: 0.30, best: 0.90}
    buffer_days: {weight: 0.20, worst: 3, best: 30}
    collection_days: {weight: 0.15, worst: 30, best: 3}
    payment_punctuality: {weight: 0.20, worst: 0.60, best: 1.00}
  bands:
    - {id: ready, label: Ready, min_score: 0.75}
    - {id: building, label: Building, min_score: 0.50}
    - {id: early, label: Early, min_score: 0.0}

# Onboarding: no keywords. This pack is what onboarding falls back to.
business_types: []

data_needs:
  - id: bank_statement
    kind: bank
    required: true
    ask: "Upload a bank or mobile-wallet statement (CSV), the last three months if you can."
    why: "It is how I see your cash, every sale, bill and fee, and how many days your cash would last."
    label: a bank or wallet statement
    unlocks: "your cash buffer and the leaks hiding in your bills"
  - id: products
    kind: products
    required: false
    ask: "If you sell products, upload your product list with cost price, sale price and stock (CSV)."
    why: "The total hides which products make money and which lose it."
    label: your product list
    unlocks: "margins per product and stock that is about to run out"
  - id: product_sales
    kind: sales
    required: false
    ask: "Upload your sales per product (date, product, quantity, amount). Three months is plenty."
    why: "Sales per product show what sells, and what sits on the shelf."
    label: your sales per product
    unlocks: "your best and worst sellers"
  - id: ad_spend
    kind: ad_spend
    required: false
    ask: "Do you run Facebook, Instagram or Google ads? If so, upload your ad spend export so I can check they are paying off."
    why: "Ads that do not pay for themselves are a common hidden cost."
    label: your ad spend export
    unlocks: "whether each ad campaign is paying for itself"

advisor_questions:
  - id: credit_sales
    ask: "Do customers buy on credit and pay later? Roughly what share of your sales?"
    why: "Credit sales are money you have earned but do not have yet. I will keep them in your cash plan."
    options:
      - {label: No credit, value: 0}
      - {label: Under 10%, value: 0.05}
      - {label: 10 to 25%, value: 0.15}
      - {label: More than 25%, value: 0.30}
      - {label: Not sure}
    effect: {fact: credit_sales_share, unit: ratio}
  - id: early_pay_discounts
    ask: "Do any suppliers give a discount if you pay early?"
    why: "A small early-payment discount is worth more than most savings accounts. I will watch the deadlines for you."
    options:
      - {label: "Yes", value: 1}
      - {label: "No", value: 2}
      - {label: Not sure}
    effect: {detector: missed_early_pay_discounts, param: min_invoices}
  - id: wallet_fees
    ask: "What fee does your mobile wallet or card provider charge per sale?"
    why: "Payment fees creep up quietly. I will flag it if you pay more than the rate you agreed."
    options:
      - {label: About 1%, value: 0.01}
      - {label: About 1.5%, value: 0.015}
      - {label: About 2%, value: 0.02}
      - {label: Not sure}
    effect: {detector: payment_fees, param: max_share_of_digital}
