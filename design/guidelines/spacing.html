<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:var(--surface);color:var(--text)}.nm{font:500 13px/18px var(--font-body);margin-top:10px}.hx{font:400 12px/16px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:16px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--font-body)}.r{display:flex;align-items:center;gap:14px;font:400 11px var(--font-mono);color:var(--text-muted);height:20px}.r i{display:block;height:8px;background:var(--brand-primary);border-radius:2px;opacity:.7}</style></head><body><div class="r"><span style="width:72px">space-1</span><i style="width:8px"></i><span>4px</span></div><div class="r"><span style="width:72px">space-2</span><i style="width:16px"></i><span>8px</span></div><div class="r"><span style="width:72px">space-3</span><i style="width:24px"></i><span>12px</span></div><div class="r"><span style="width:72px">space-4</span><i style="width:32px"></i><span>16px</span></div><div class="r"><span style="width:72px">space-5</span><i style="width:40px"></i><span>20px</span></div><div class="r"><span style="width:72px">space-6</span><i style="width:48px"></i><span>24px</span></div><div class="r"><span style="width:72px">space-8</span><i style="width:64px"></i><span>32px</span></div><div class="r"><span style="width:72px">space-10</span><i style="width:80px"></i><span>40px</span></div><div class="r"><span style="width:72px">space-12</span><i style="width:96px"></i><span>48px</span></div><div class="r"><span style="width:72px">space-16</span><i style="width:128px"></i><span>64px</span></div></body></html>
