<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:var(--surface);color:var(--text)}.nm{font:500 13px/18px var(--font-body);margin-top:10px}.hx{font:400 12px/16px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:16px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--font-body)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-muted);color:var(--brand-primary);">Pay Fresh Farms</div><div class="nm">brand-primary · text, links, lines</div><div class="hx">#02A27D · 5.7:1 on surface</div></div><div class="sw"><div class="chip" style="background:var(--kc-green-fill);color:var(--on-brand);">Sign and approve</div><div class="nm">Logo green · primary fill</div><div class="hx">#01775A · white 5.5:1</div></div><div class="sw"><div class="chip" style="background:var(--brand-primary-soft);color:var(--brand-primary);">Active, hover</div><div class="nm">brand-primary-soft</div><div class="hx">#132A27 · wash only</div></div><div class="sw"><div class="chip" style="background:var(--surface-muted);color:var(--brand-primary-hover);">Link hover</div><div class="nm">brand-primary-hover</div><div class="hx">#34BC97</div></div></div></body></html>
