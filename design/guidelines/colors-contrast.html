<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:var(--surface);color:var(--text)}.nm{font:500 13px/18px var(--font-body);margin-top:10px}.hx{font:400 12px/16px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:16px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--font-body)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.t{padding:12px 14px;border-radius:var(--radius-sm);font:500 14px/18px var(--font-body);display:flex;justify-content:space-between}.t span{font:400 12px var(--font-mono);color:var(--text-muted)}.x{text-decoration:line-through}</style></head><body><div class="g"><div class="t" style="background:var(--surface-raised);color:var(--text)">Text on raised<span>13.1</span></div><div class="t" style="background:var(--surface-raised);color:var(--text-muted)">Muted on raised<span>5.9</span></div><div class="t" style="background:var(--surface-raised);color:var(--brand-primary)">Green on raised<span>4.8</span></div><div class="t" style="background:var(--kc-green-fill);color:#fff">White on fill<span>5.5</span></div><div class="t" style="background:var(--surface-raised);color:var(--brand-accent)">Gold on raised<span>7.7</span></div><div class="t" style="background:var(--surface-raised);color:var(--danger)">Coral on raised<span>5.8</span></div><div class="t" style="background:var(--surface);color:var(--text-muted)">Muted on surface<span>7.0</span></div><div class="t" style="background:var(--brand-primary-soft);color:var(--brand-primary)">Green on wash<span>4.7</span></div><div class="t" style="background:var(--danger-soft);color:var(--danger)">Coral on coral wash<span>5.4</span></div><div class="t x" style="background:var(--brand-primary);color:#fff">White on light green<span>3.3 no</span></div><div class="t x" style="background:var(--surface-raised);color:var(--border-strong)">Strong line as text<span>3.6 no</span></div><div class="t x" style="background:var(--surface);color:var(--kc-navy)">Logo navy on surface<span>1.2 no</span></div></div></body></html>
