name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Replay mode, no API keys, no secrets: CI never calls an LLM or the testnet.
      LLM_REPLAY: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup BOOT_PY=python
      - run: make test
