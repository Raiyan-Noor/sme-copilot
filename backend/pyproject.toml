[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sme-copilot"
version = "0.1.0"
description = "Backend for an AI agent that runs a small business's finances within owner-signed limits."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "faker>=26",
    "pynacl>=1.5",
    "openai>=1.40",
    "web3>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "golden: golden-output tests for engine facts",
    "policy: gateway policy boundary tests",
    "redteam: attack cases expected to be blocked",
    "benign: benign cases expected to succeed",
]
