<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:var(--surface);color:var(--text)}.nm{font:500 13px/18px var(--font-body);margin-top:10px}.hx{font:400 12px/16px var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:16px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;font:500 12px var(--font-body)}.row{display:flex;gap:16px;align-items:flex-end}.b{background:var(--surface-raised);display:flex;align-items:flex-end;padding:10px;font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="b" style="width:120px;height:72px;border-radius:var(--radius-sm)">sm 8 · inputs</div><div class="b" style="width:140px;height:88px;border-radius:var(--radius-md)">md 14 · toast, inset</div><div class="b" style="width:160px;height:104px;border-radius:var(--radius-lg)">lg 20 · groups</div><div class="b" style="width:160px;height:40px;border-radius:var(--radius-full);align-items:center;justify-content:center">full · buttons, pills</div></div></body></html>
